[package]
name = "island"
version = "0.4.0"
description = "Liquid Dynamic Island for Windows 10/11"
authors = ["Callzik"]
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.9", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-drag = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
rqrr = "0.11"
# signing Yandex Music lyrics requests
hmac = "0.12"
sha2 = "0.10"
# HTTP for the AI chat / weather: Windows' own TLS (schannel), no C toolchain needed
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "multipart", "charset"] }
pdf-extract = "0.12"
zip = { version = "2", default-features = false, features = ["deflate"] }
cpal = "0.15"
notify = { version = "8", default-features = false }

[target.'cfg(windows)'.dependencies]
# screen recording to MP4 (Graphics.Capture + Media Foundation encoder)
windows-capture = "1"
# needed by the #[interface] macro (IPolicyConfig)
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Media_SpeechRecognition",
  "Media_Control",
  "Storage_Streams",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Devices_Properties",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Shutdown",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
